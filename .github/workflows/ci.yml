name: CI

# Documentation-only changes skip this workflow entirely; markdown linting
# lives in docs.yml, which claims the same paths this one ignores. A change
# touching both docs and code still runs here, because a path filter only
# skips when every changed file matches it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

# Default to no permissions; each job requests exactly what it needs.
permissions: {}

# Runners are pinned to a specific image rather than ubuntu-latest: GitHub
# migrates that alias on its own schedule, which can change the toolchain
# under a build with no commit here. Dependabot does not track runs-on, so
# bump it deliberately when GitHub announces an image deprecation.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Part of the binary cache key below. Dependabot does not watch this,
      # so bump it by hand.
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve the toolchain for the cache key
        id: toolchain
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # The linter is built from source rather than downloaded, so that its
      # own Go version can never be older than the one this module targets:
      # a prebuilt binary refuses to analyse a newer target. Building it costs
      # ~70s, so cache the result on the linter version plus the toolchain
      # that produced it, which are the only things that change the output.
      - name: Cache golangci-lint
        id: lint-bin
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/palan-lint-bin
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.toolchain.outputs.version }}
      - name: Build golangci-lint
        if: steps.lint-bin.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/.cache/palan-lint-bin" \
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
      - name: Put golangci-lint on PATH
        run: echo "$HOME/.cache/palan-lint-bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The binary is already on PATH, from the cache or the step above.
          install-mode: none
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format, vet, tidy, unit tests
        run: make fmt-check vet tidy-check test
      - name: Build and smoke-test the binary
        run: |
          make build
          ./bin/palan version

  e2e:
    name: End-to-end and interop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pinned interop tools. These versions form the cache key below, so
      # editing one here is all it takes to rebuild the cached binaries.
      ORAS_VERSION: v1.3.3
      MODCTL_VERSION: v0.2.2
      COSIGN_VERSION: v2.6.3
    services:
      zot:
        # zot-minimal: the suite only uses the core Distribution API, so the
        # extension-carrying build is unnecessary weight here. Deployments
        # want the full build (see deploy/zot/values.yaml).
        # Keep the pin in sync with test/e2e/main_test.go. Dependabot does
        # not watch service images, so bump the digest by hand alongside the
        # tag.
        image: ghcr.io/project-zot/zot-minimal-linux-amd64:v2.1.18@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go's cache is keyed on our own go.sum, which says nothing about
      # these tools, so without a cache of their own every run re-downloads
      # ~360 modules and recompiles cosign's dependency tree from scratch.
      - name: Cache interop tools
        id: interop-tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/palan-interop-tools
          key: interop-tools-${{ runner.os }}-${{ runner.arch }}-oras${{ env.ORAS_VERSION }}-modctl${{ env.MODCTL_VERSION }}-cosign${{ env.COSIGN_VERSION }}
      - name: Install interop tools (oras, modctl, cosign)
        if: steps.interop-tools.outputs.cache-hit != 'true'
        env:
          # setup-go pins GOTOOLCHAIN=local to our go.mod minimum; these
          # tools may require newer patch releases; let go auto-fetch them.
          GOTOOLCHAIN: auto
        run: |
          export GOBIN="$HOME/.cache/palan-interop-tools"
          go install "oras.land/oras/cmd/oras@$ORAS_VERSION"
          go install "github.com/modelpack/modctl@$MODCTL_VERSION"
          go install "github.com/sigstore/cosign/v2/cmd/cosign@$COSIGN_VERSION"
      - name: Put interop tools on PATH
        run: echo "$HOME/.cache/palan-interop-tools" >> "$GITHUB_PATH"
      - name: Run e2e suite
        env:
          E2E_REGISTRY: localhost:5000
        run: make e2e

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Scan with current stable Go: govulncheck checks the *standard
          # library* of the toolchain in use, and our go.mod minimum
          # (1.26.0) has stdlib CVEs fixed in later patch releases.
          go-version: stable
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
