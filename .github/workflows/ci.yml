name: CI

# This workflow always starts, and decides per job whether there is anything
# to do. A path filter on the trigger would skip the workflow outright, and a
# check that never reports cannot be required: a branch rule waiting on it
# would block every documentation-only change forever. A job skipped by its
# own condition still reports, and counts as passing.
on:
  push:
    branches: [main]
  pull_request:
  # A run that never started cannot be re-run, and a push event is not
  # replayable, so a commit whose run was lost has no other way back to a
  # verdict short of an empty commit.
  workflow_dispatch:

# Default to no permissions; each job requests exactly what it needs.
permissions: {}

# Runners are pinned to a specific image rather than ubuntu-latest: GitHub
# migrates that alias on its own schedule, which can change the toolchain
# under a build with no commit here. Dependabot does not track runs-on, so
# bump it deliberately when GitHub announces an image deprecation.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which halves of the tree a change touches, so the jobs below can stand
  # down without the workflow having to skip. The comparison is spelled out
  # here rather than delegated, because the decision has to be readable in
  # the log: a filter that answers yes to everything looks exactly like a
  # working one from the outside, and the whole suite running against a typo
  # in a heading is not a failure anything reports.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List what changed and decide whether any of it is code
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No base to compare against (a new branch, or a manual run) means
          # nothing has been established about this tree, so run everything.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base to compare against, treating the change as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'
          # Code is anything that is neither a markdown file nor under
          # docs/. The result is captured and tested for emptiness rather
          # than read from grep's exit status, which reports the same
          # absence for "everything was documentation" as for a pattern
          # that matched nothing because it was wrong.
          rest=$(printf '%s\n' "$files" | grep -vE '\.md$|^docs/' || true)
          if [ -n "$rest" ]; then
            echo "decision: code, because of:"
            printf '%s\n' "$rest" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "decision: documentation only"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Part of the binary cache key below. Dependabot does not watch this,
      # so bump it by hand.
      GOLANGCI_LINT_VERSION: v2.13.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve the toolchain for the cache key
        id: toolchain
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # The linter is built from source rather than downloaded, so that its
      # own Go version can never be older than the one this module targets:
      # a prebuilt binary refuses to analyse a newer target. Building it costs
      # ~70s, so cache the result on the linter version plus the toolchain
      # that produced it, which are the only things that change the output.
      - name: Cache golangci-lint
        id: lint-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/palan-lint-bin
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ steps.toolchain.outputs.version }}
      - name: Build golangci-lint
        if: steps.lint-bin.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/.cache/palan-lint-bin" \
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
      - name: Put golangci-lint on PATH
        run: echo "$HOME/.cache/palan-lint-bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The binary is already on PATH, from the cache or the step above.
          install-mode: none
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # notice-check runs here rather than in a job of its own: it needs the
      # module cache this job already has, and a dependency bump is the event
      # that makes NOTICE incomplete.
      - name: Format, vet, tidy, attribution, unit tests
        run: make fmt-check vet tidy-check notice-check test
      - name: Build and smoke-test the binary
        run: |
          make build
          ./bin/palan version

  e2e:
    name: End-to-end and interop
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pinned interop tools. These versions form the cache key below, so
      # editing one here is all it takes to rebuild the cached binaries.
      ORAS_VERSION: v1.3.3
      MODCTL_VERSION: v0.2.2
      COSIGN_VERSION: v2.6.3
      MODEL_SIGNING_VERSION: 1.1.1
    services:
      zot:
        # zot-minimal: the suite only uses the core Distribution API, so the
        # extension-carrying build is unnecessary weight here. Deployments
        # want the full build (see deploy/zot/values.yaml).
        # Keep the pin in sync with test/e2e/main_test.go. Dependabot does
        # not watch service images, so bump the digest by hand alongside the
        # tag.
        image: ghcr.io/project-zot/zot-minimal-linux-amd64:v2.1.18@sha256:f1ffb7a5bbddc0feea83646e29c587ecf39b3193733b447749d4c9ead111a395
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go's cache is keyed on our own go.sum, which says nothing about
      # these tools, so without a cache of their own every run re-downloads
      # ~360 modules and recompiles cosign's dependency tree from scratch.
      - name: Cache interop tools
        id: interop-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/palan-interop-tools
            ~/.cache/palan-model-signing
          key: interop-tools-${{ runner.os }}-${{ runner.arch }}-oras${{ env.ORAS_VERSION }}-modctl${{ env.MODCTL_VERSION }}-cosign${{ env.COSIGN_VERSION }}-ms${{ env.MODEL_SIGNING_VERSION }}
      - name: Install interop tools (oras, modctl, cosign)
        if: steps.interop-tools.outputs.cache-hit != 'true'
        env:
          # setup-go pins GOTOOLCHAIN=local to our go.mod minimum; these
          # tools may require newer patch releases; let go auto-fetch them.
          GOTOOLCHAIN: auto
        run: |
          export GOBIN="$HOME/.cache/palan-interop-tools"
          go install "oras.land/oras/cmd/oras@$ORAS_VERSION"
          go install "github.com/modelpack/modctl@$MODCTL_VERSION"
          go install "github.com/sigstore/cosign/v2/cmd/cosign@$COSIGN_VERSION"
      - name: Install the model-signing tool
        if: steps.interop-tools.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$HOME/.cache/palan-model-signing"
          "$HOME/.cache/palan-model-signing/bin/pip" install --quiet "model-signing==$MODEL_SIGNING_VERSION"
      - name: Put interop tools on PATH
        run: |
          echo "$HOME/.cache/palan-interop-tools" >> "$GITHUB_PATH"
          echo "$HOME/.cache/palan-model-signing/bin" >> "$GITHUB_PATH"
      # Runs unconditionally, on both a cache hit and a cache miss: a
      # SKIPPED interop test prints the same "ok" a passing one does, so a
      # cache that restored files without leaving model_signing callable
      # would otherwise go green and freeze that outcome for every later
      # run. Failing here, before the suite starts, turns that into a loud
      # CI failure instead of a silently skipped proof.
      - name: Confirm the model-signing tool is callable
        run: model_signing --version
      - name: Run e2e suite
        env:
          E2E_REGISTRY: localhost:5000
        run: make e2e

  govulncheck:
    name: Vulnerability scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # govulncheck checks the *standard library* of the toolchain in
          # use, so it must not run on one older than what builds a release.
          go-version: stable
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  # One check to require. It reports for every pull request, including one
  # that touched no code at all, and refuses unless every job above either
  # passed or stood down. Requiring the jobs individually would work too,
  # until someone adds a fifth and forgets to add it to the branch rule.
  gate:
    name: CI gate
    needs: [changes, lint, test, e2e, govulncheck]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unless every job above passed or stood down
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a job this gate covers reported $r"; exit 1 ;;
            esac
          done
