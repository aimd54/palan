# OpenSSF Scorecard supply-chain security analysis.
# Results feed the badge in README.md and the repo's code-scanning tab.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1' # weekly, Monday 02:30 UTC
  branch_protection_rule:

# Default to no permissions; the job requests exactly what it needs.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF REST API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
