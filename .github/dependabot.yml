version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init, autobuild and analyze share one pinned commit and have to agree
      # on it: a change that moves one of them alone leaves the job failing
      # with a configuration error, so the update is only mergeable as a set.
      # upload-sarif belongs here too, though it runs in its own workflow and
      # would pass on its own.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Keeps the digest pins in Dockerfile and Dockerfile.release current.
  # Service-container images in workflows are not covered; bump those by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
