version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keeps the digest pins in Dockerfile and Dockerfile.release current.
  # Service-container images in workflows are not covered; bump those by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
